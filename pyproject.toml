[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-aecroformer"
version = "1.0.0"
description = "Physics-informed aerosol microphysical retrieval from 3beta+2alpha lidar observations"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.10.1", "scikit-learn==1.6.1", "torch==2.8.0", "miepython==3.0.2", "pandas==2.2.3", "matplotlib==3.10.0", "threadpoolctl==3.6.0", "numba==0.61.2"]

[project.scripts]
pi-aecroformer = "pi_aecroformer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

